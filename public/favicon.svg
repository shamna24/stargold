<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions of gradients and filters -->
  <defs>
    <!-- Gold Gradient for Star (Top-Right) -->
    <linearGradient id="gold-bright" x1="256" y1="80" x2="432" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3C3" />
      <stop offset="50%" stop-color="#F3DA7A" />
      <stop offset="100%" stop-color="#C9A84C" />
    </linearGradient>
    
    <!-- Gold Gradient for Star (Bottom-Right) -->
    <linearGradient id="gold-dark" x1="432" y1="256" x2="256" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#8F7128" />
    </linearGradient>

    <!-- Silver Gradient for Star (Top-Left) -->
    <linearGradient id="silver-bright" x1="80" y1="256" x2="256" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Silver Gradient for Star (Bottom-Left) -->
    <linearGradient id="silver-dark" x1="80" y1="256" x2="256" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>

    <!-- Outer Ring Gold Gradient -->
    <linearGradient id="ring-gold" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3DA7A" />
      <stop offset="50%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#8F7128" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Circle -->
  <circle cx="256" cy="256" r="236" fill="#0A0A0A" />

  <!-- Outer Glowing Gold Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#ring-gold)" stroke-width="12" stroke-opacity="0.9" />

  <!-- 3D Beveled 4-Pointed Star -->
  <g filter="url(#glow)">
    <!-- Top-Left Facet (Silver Bright) -->
    <path d="M256 80 Q256 256 80 256 L256 256 Z" fill="url(#silver-bright)" />

    <!-- Bottom-Left Facet (Silver Dark) -->
    <path d="M80 256 Q256 256 256 432 L256 256 Z" fill="url(#silver-dark)" />

    <!-- Top-Right Facet (Gold Bright) -->
    <path d="M256 80 Q256 256 432 256 L256 256 Z" fill="url(#gold-bright)" />

    <!-- Bottom-Right Facet (Gold Dark) -->
    <path d="M432 256 Q256 256 256 432 L256 256 Z" fill="url(#gold-dark)" />
  </g>

  <!-- Small Glowing Diamond in Center -->
  <polygon points="256,236 276,256 256,276 236,256" fill="#FFFFFF" opacity="0.9" />
</svg>